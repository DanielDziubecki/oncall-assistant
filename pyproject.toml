[project]
name = "oncall"
version = "0.0.1"
description = "Vendor-agnostic, read-only AI on-call agent that diagnoses production incidents with verifiable evidence."
readme = "README.md"
license = "MIT"
authors = [{ name = "Daniel Dziubecki" }]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
oncall = "oncall.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "PT",      # pytest style
    "RUF",     # ruff-specific
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
