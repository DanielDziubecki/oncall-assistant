[project]
name = "factory"
version = "0.1.0"
description = "This repo's development factory: runs coding agents (Claude Code, Codex) as interchangeable workers."
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Daniel Dziubecki" }]
dependencies = [
    "pydantic>=2.14.2",
]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
